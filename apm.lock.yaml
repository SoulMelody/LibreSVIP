mcp_servers:
- debugmcp
- flet
- io.github.upstash/context7
- qt-documentation
mcp_configs:
  debugmcp:
    name: debugmcp
    transport: http
    registry: false
    url: http://127.0.0.1:3001/mcp
  flet:
    name: flet
    transport: stdio
    args:
    - run
    - flet
    - mcp
    registry: false
    command: uv
  io.github.upstash/context7:
    name: io.github.upstash/context7
  qt-documentation:
    name: qt-documentation
    transport: http
    registry: false
    url: https://qt-docs-mcp.qt.io/mcp
mcp_target_servers:
  claude:
  - debugmcp
  - flet
  - io.github.upstash/context7
  - qt-documentation
  codex:
  - debugmcp
  - flet
  - io.github.upstash/context7
  - qt-documentation
  copilot:
  - debugmcp
  - flet
  - io.github.upstash/context7
  - qt-documentation
  cursor:
  - debugmcp
  - flet
  - io.github.upstash/context7
  - qt-documentation
  opencode:
  - debugmcp
  - flet
  - io.github.upstash/context7
  - qt-documentation
lsp_servers:
- protobuf
- pyrefly
- ruff
- ty
lsp_configs:
  protobuf:
    name: protobuf
    command: buf
    args:
    - lsp
    - serve
    extensionToLanguage:
      .proto: protobuf
  pyrefly:
    name: pyrefly
    command: pyrefly
    args:
    - lsp
    extensionToLanguage:
      .py: python
      .pyi: python
    transport: stdio
    startupTimeout: 10000
  ruff:
    name: ruff
    command: ruff
    args:
    - server
    extensionToLanguage:
      .py: python
      .pyi: python
    transport: stdio
    startupTimeout: 10000
  ty:
    name: ty
    command: uvx
    args:
    - ty@latest
    - server
    extensionToLanguage:
      .py: python
      .pyi: python
lsp_target_servers:
  claude:
  - protobuf
  - pyrefly
  - ruff
  - ty
  copilot:
  - protobuf
  - pyrefly
  - ruff
  - ty
lsp_config_provenance:
  protobuf: package:bufbuild/claude-plugins/plugins/protobuf
  pyrefly: project:.
  ruff: project:.
  ty: package:astral-sh/claude-code-plugins/plugins/astral
