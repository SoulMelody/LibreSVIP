name: LibreSVIP
version: 1.0.0
description: APM project for LibreSVIP
author: SoulMelody
targets:
  - claude
  - codex
  - copilot
  - grok-build
  - opencode
dependencies:
  apm:
    - TheQtCompanyRnD/agent-skills/skills/qt-qml#main
    - astral-sh/claude-code-plugins/plugins/astral#main
    - pydantic/skills/skills/pydantic#default
    - bufbuild/claude-plugins/plugins/protobuf#main
  mcp:
    - io.github.upstash/context7
    - name: qt-documentation
      registry: false
      transport: http
      url: https://qt-docs-mcp.qt.io/mcp
  lsp:
    - name: ruff
      command: ruff
      args: ["server"]
      extensionToLanguage:
        ".py": python
        ".pyi": python
      transport: stdio
      startupTimeout: 10000
    - name: pyrefly
      command: pyrefly
      args: ["lsp"]
      extensionToLanguage:
        ".py": python
        ".pyi": python
      transport: stdio
      startupTimeout: 10000
includes: auto
scripts: {}
