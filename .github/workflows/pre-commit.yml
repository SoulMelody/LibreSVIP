name: pre-commit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
      - name: Install linting dependencies
        run: |
          uv sync --all-extras --group linting
      - uses: j178/prek-action@v3.1.1

  reviewdog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-setup@v1
      - name: Install ruff & pyrefly
        run: pip install ruff pyrefly
      - name: Run reviewdog (ruff -> SARIF)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format sarif . \
            | reviewdog -f=sarif -name=ruff \
                -reporter=github-pr-review -filter-mode=added
      - name: Run reviewdog (pyrefly -> SARIF)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pyrefly check --output-format sarif . \
            | reviewdog -f=sarif -name=pyrefly \
                -reporter=github-pr-review -filter-mode=added
