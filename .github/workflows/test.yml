name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
        python-version: ["3.11", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up rust
        if: matrix.os == 'windows-11-arm' || matrix.os == 'macos-15-intel'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || 'x86_64-apple-darwin' }}

      - name: Download Windows ARM OpenSSL
        if: matrix.os == 'windows-11-arm'
        uses: dawidd6/action-download-artifact@v11
        with:
          repo: pyca/infra
          workflow: build-windows-openssl.yml
          branch: main
          workflow_conclusion: success
          name: openssl-arm64
          path: C:/openssl-arm64/
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS x86_64 OpenSSL
        if: matrix.os == 'macos-15-intel'
        uses: dawidd6/action-download-artifact@v11
        with:
          repo: pyca/infra
          workflow: build-macos-openssl.yml
          branch: main
          workflow_conclusion: success
          name: openssl-macos-x86-64
          path: ${{ github.workspace }}/openssl-macos-x86-64
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up rust
        if: matrix.os == 'windows-11-arm'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Download OpenSSL
        if: matrix.os == 'windows-11-arm'
        uses: dawidd6/action-download-artifact@v11
        with:
          repo: pyca/infra
          workflow: build-windows-openssl.yml
          branch: main
          workflow_conclusion: success
          name: openssl-arm64
          path: C:/openssl-arm64/
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        env:
          OPENSSL_DIR: ${{ matrix.os == 'windows-11-arm' && 'C:/openssl-arm64' || matrix.os == 'macos-15-intel' && format('{0}/openssl-macos-x86-64', github.workspace) || '' }}
          OPENSSL_STATIC: ${{ (matrix.os == 'windows-11-arm' || matrix.os == 'macos-15-intel') && '1' || '' }}
        run: |
          uv sync --all-extras --group test

      - name: Run tests
        run: |
          uv run pytest tests/ -v
